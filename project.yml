# XcodeGen spec — generate the Xcode project with:  xcodegen generate
name: FilmLab
options:
  bundleIdPrefix: app.filmlab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team for device builds (required to test with a real X-T30 III).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  FilmLab:
    type: application
    platform: iOS
    sources:
      - path: FilmLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.filmlab.FilmLab
        PRODUCT_NAME: FilmLab
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FilmLab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        # Apple: tethering from an iOS app via ImageCaptureCore requires NSCameraUsageDescription.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "FilmLab uses Bluetooth to find your FUJIFILM camera, pair with it, keep its clock and geotags in sync, and fire the remote shutter."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "When you turn on location sharing, FilmLab sends your location to your paired camera so photos are geotagged."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "FilmLab connects to your FUJIFILM camera's own Wi‑Fi network to browse and import your photos."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "FilmLab saves the photos you import from your camera to your library."
        INFOPLIST_KEY_NSCameraUsageDescription: "FilmLab connects to your USB camera to read and back up custom settings, and — only when you choose — to write a recipe to a slot."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  FilmLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FilmLabTests
    dependencies:
      - target: FilmLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.filmlab.FilmLabTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FilmLab.app/FilmLab"
        BUNDLE_LOADER: "$(TEST_HOST)"
  FilmLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FilmLabUITests
    dependencies:
      - target: FilmLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.filmlab.FilmLabUITests
        TEST_TARGET_NAME: FilmLab
schemes:
  FilmLab:
    build:
      targets:
        FilmLab: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FilmLabTests
        - FilmLabUITests
